services:
  morse:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MORSE_TOKEN: ${MORSE_TOKEN:?Set MORSE_TOKEN in .env}
      MORSE_HOME: /home/morse/.morse
    ports:
      - "127.0.0.1:7800:7800"
    volumes:
      - sessions:/home/morse/.morse
      - projects:/home/morse/projects
    init: true
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7800/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  sessions:
  projects:
